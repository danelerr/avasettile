name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm exec tsc --noEmit -p tsconfig.json

      - name: Lint
        run: pnpm exec eslint "{src,test}/**/*.ts"

      - name: Unit tests
        run: pnpm test

      - name: E2E tests
        run: pnpm test:e2e

      - name: Build
        run: pnpm build

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Set up contract libs (forge-std + OpenZeppelin)
        run: pnpm contracts:setup

      - name: Format check
        run: pnpm contracts:fmt:check

      - name: Build contracts
        run: pnpm contracts:build

      - name: Contract tests
        run: pnpm contracts:test

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: avasettle
          POSTGRES_PASSWORD: avasettle
          POSTGRES_DB: avasettle
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U avasettle"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AVASETTLE_DATABASE_URL: postgres://avasettle:avasettle@localhost:5432/avasettle
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply migrations to a fresh database
        run: pnpm db:migrate

      - name: Re-apply migrations (idempotency check)
        run: pnpm db:migrate

      - name: Integration tests against PostgreSQL
        run: pnpm test:integration
