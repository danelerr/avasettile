enum PayinMode {
  deposit_address
  payment_router
  eerc_private
}

enum PayinStatus {
  pending
  detected
  confirmed
  underpaid
  overpaid
  expired
  sweep_pending
  sweep_submitted
  sweep_confirmed
  sweep_failed
  failed
}

enum PayoutStatus {
  prepared
  authorized
  broadcasted
  confirmed
  failed
  canceled
  needs_review
}

enum SettlementStatus {
  pending
  completed
  failed
  canceled
}

enum SettlementSourceType {
  payin
  payout
  manual
  router_payin
  eerc_private_payment
}

enum RiskLevel {
  low
  medium
  high
  rejected
}

type Institution @table(name: "institutions") {
  id: UUID! @default(sql: "gen_random_uuid()")
  name: String!
  legalName: String @col(name: "legal_name")
  countryCode: String @col(name: "country_code", dataType: "char(2)")
  status: String! @default(value: "active")
  metadata: Any! @default(sql: "'{}'::jsonb")
  createdAt: Timestamp! @col(name: "created_at") @default(sql: "now()")
  updatedAt: Timestamp! @col(name: "updated_at") @default(sql: "now()")
}

type Merchant @table(name: "merchants") {
  id: UUID! @default(sql: "gen_random_uuid()")
  institutionId: UUID @col(name: "institution_id")
  externalId: String @col(name: "external_id")
  name: String!
  countryCode: String @col(name: "country_code", dataType: "char(2)")
  status: String! @default(value: "active")
  settlementCurrency: String!
    @col(name: "settlement_currency")
    @default(value: "USD")
  metadata: Any! @default(sql: "'{}'::jsonb")
  createdAt: Timestamp! @col(name: "created_at") @default(sql: "now()")
  updatedAt: Timestamp! @col(name: "updated_at") @default(sql: "now()")
}

type Asset @table(name: "assets") {
  id: UUID! @default(sql: "gen_random_uuid()")
  network: String!
  chainId: Int! @col(name: "chain_id")
  symbol: String!
  tokenAddress: String @col(name: "token_address")
  decimals: Int!
  enabled: Boolean! @default(value: true)
  metadata: Any! @default(sql: "'{}'::jsonb")
  createdAt: Timestamp! @col(name: "created_at") @default(sql: "now()")
  updatedAt: Timestamp! @col(name: "updated_at") @default(sql: "now()")
}

type TreasuryWallet @table(name: "treasury_wallets") {
  id: UUID! @default(sql: "gen_random_uuid()")
  institutionId: UUID @col(name: "institution_id")
  network: String!
  chainId: Int! @col(name: "chain_id")
  address: String!
  label: String
  active: Boolean! @default(value: true)
  purpose: String! @default(value: "main_treasury")
  metadata: Any! @default(sql: "'{}'::jsonb")
  createdAt: Timestamp! @col(name: "created_at") @default(sql: "now()")
  updatedAt: Timestamp! @col(name: "updated_at") @default(sql: "now()")
}

type PayinIntent
  @table(name: "payin_intents")
  @index(fields: ["status"])
  @index(fields: ["createdAt"], order: [DESC]) {
  id: UUID! @default(sql: "gen_random_uuid()")
  institutionId: UUID @col(name: "institution_id")
  merchantId: UUID @col(name: "merchant_id")
  externalId: String @col(name: "external_id")
  invoiceId: String @col(name: "invoice_id")
  mode: PayinMode! @col(dataType: "payin_mode") @default(value: deposit_address)
  status: PayinStatus!
    @col(dataType: "payin_status")
    @default(value: pending)
  network: String!
  chainId: Int! @col(name: "chain_id")
  asset: String!
  tokenAddress: String @col(name: "token_address")
  decimals: Int! @default(value: 6)
  amountExpected: Float!
    @col(name: "amount_expected", dataType: "numeric(36, 18)")
  amountExpectedAtomic: String!
    @col(name: "amount_expected_atomic", dataType: "numeric(78, 0)")
  amountDetected: Float
    @col(name: "amount_detected", dataType: "numeric(36, 18)")
  amountDetectedAtomic: String
    @col(name: "amount_detected_atomic", dataType: "numeric(78, 0)")
  depositAddress: String @col(name: "deposit_address")
  derivationAccount: Int @col(name: "derivation_account")
  derivationIndex: Int64 @col(name: "derivation_index")
  startBlock: Int64 @col(name: "start_block")
  paidTxHash: String @col(name: "paid_tx_hash")
  paidBlockNumber: Int64 @col(name: "paid_block_number")
  payerAddress: String @col(name: "payer_address")
  sweepDestination: String @col(name: "sweep_destination")
  sweepTxHash: String @col(name: "sweep_tx_hash")
  sweepBlockNumber: Int64 @col(name: "sweep_block_number")
  sweepError: String @col(name: "sweep_error")
  expiresAt: Timestamp @col(name: "expires_at")
  settlementCurrency: String @col(name: "settlement_currency")
  settlementFxRate: Float
    @col(name: "settlement_fx_rate", dataType: "numeric(36, 18)")
  settlementFeeBps: Int @col(name: "settlement_fee_bps")
  settlementId: UUID @col(name: "settlement_id")
  riskLevel: RiskLevel @col(name: "risk_level", dataType: "risk_level")
  riskScore: Int @col(name: "risk_score")
  metadata: Any! @default(sql: "'{}'::jsonb")
  createdAt: Timestamp! @col(name: "created_at") @default(sql: "now()")
  updatedAt: Timestamp! @col(name: "updated_at") @default(sql: "now()")
}

type PaymentRouterIntent @table(name: "payment_router_intents") {
  id: UUID! @default(sql: "gen_random_uuid()")
  payinIntentId: UUID @col(name: "payin_intent_id")
  routerAddress: String! @col(name: "router_address")
  invoiceIdBytes32: String! @col(name: "invoice_id_bytes32")
  merchantAddress: String @col(name: "merchant_address")
  payerAddress: String @col(name: "payer_address")
  tokenAddress: String! @col(name: "token_address")
  amountExpected: Float!
    @col(name: "amount_expected", dataType: "numeric(36, 18)")
  amountExpectedAtomic: String!
    @col(name: "amount_expected_atomic", dataType: "numeric(78, 0)")
  invoicePaidTxHash: String @col(name: "invoice_paid_tx_hash")
  invoicePaidBlockNumber: Int64 @col(name: "invoice_paid_block_number")
  status: String! @default(value: "pending")
  metadata: Any! @default(sql: "'{}'::jsonb")
  createdAt: Timestamp! @col(name: "created_at") @default(sql: "now()")
  updatedAt: Timestamp! @col(name: "updated_at") @default(sql: "now()")
}

type PayoutRequest
  @table(name: "payout_requests")
  @index(fields: ["status"])
  @index(fields: ["createdAt"], order: [DESC]) {
  id: UUID! @default(sql: "gen_random_uuid()")
  institutionId: UUID @col(name: "institution_id")
  merchantId: UUID @col(name: "merchant_id")
  externalId: String! @col(name: "external_id")
  chainFlowRequestId: String @col(name: "chain_flow_request_id")
  chainFlowExternalTx: String @col(name: "chain_flow_external_tx")
  chainFlowRetiroPago: Int64 @col(name: "chain_flow_retiro_pago")
  chainFlowTransferBlock: Int64 @col(name: "chain_flow_transfer_block")
  chainFlowPaymentProcessor: Int64
    @col(name: "chain_flow_payment_processor")
  chainFlowCurrencyCode: Int64 @col(name: "chain_flow_currency_code")
  status: PayoutStatus!
    @col(dataType: "payout_status")
    @default(value: prepared)
  network: String!
  chainId: Int! @col(name: "chain_id")
  asset: String!
  tokenAddress: String @col(name: "token_address")
  decimals: Int! @default(value: 6)
  amount: Float! @col(dataType: "numeric(36, 18)")
  amountAtomic: String! @col(name: "amount_atomic", dataType: "numeric(78, 0)")
  beneficiaryAddress: String! @col(name: "beneficiary_address")
  beneficiaryName: String @col(name: "beneficiary_name")
  treasuryAddress: String @col(name: "treasury_address")
  transactionHash: String @col(name: "transaction_hash")
  blockNumber: Int64 @col(name: "block_number")
  confirmations: Int
  riskLevel: RiskLevel @col(name: "risk_level", dataType: "risk_level")
  riskScore: Int @col(name: "risk_score")
  errorMessage: String @col(name: "error_message")
  metadata: Any! @default(sql: "'{}'::jsonb")
  preparedAt: Timestamp @col(name: "prepared_at")
  authorizedAt: Timestamp @col(name: "authorized_at")
  broadcastedAt: Timestamp @col(name: "broadcasted_at")
  confirmedAt: Timestamp @col(name: "confirmed_at")
  failedAt: Timestamp @col(name: "failed_at")
  createdAt: Timestamp! @col(name: "created_at") @default(sql: "now()")
  updatedAt: Timestamp! @col(name: "updated_at") @default(sql: "now()")
}

type Settlement
  @table(name: "settlements")
  @index(fields: ["status"])
  @index(fields: ["createdAt"], order: [DESC]) {
  id: UUID! @default(sql: "gen_random_uuid()")
  institutionId: UUID @col(name: "institution_id")
  merchantId: UUID @col(name: "merchant_id")
  sourceType: SettlementSourceType!
    @col(name: "source_type", dataType: "settlement_source_type")
  sourceId: UUID @col(name: "source_id")
  status: SettlementStatus!
    @col(dataType: "settlement_status")
    @default(value: pending)
  asset: String!
  grossAmount: Float! @col(name: "gross_amount", dataType: "numeric(36, 18)")
  feeBps: Int! @col(name: "fee_bps") @default(value: 0)
  feeAmount: Float!
    @col(name: "fee_amount", dataType: "numeric(36, 18)")
    @default(value: 0)
  netAmount: Float! @col(name: "net_amount", dataType: "numeric(36, 18)")
  fiatCurrency: String! @col(name: "fiat_currency") @default(value: "USD")
  fxRate: Float! @col(name: "fx_rate", dataType: "numeric(36, 18)")
  fiatAmount: Float! @col(name: "fiat_amount", dataType: "numeric(36, 18)")
  payoutRequestId: UUID @col(name: "payout_request_id")
  payinIntentId: UUID @col(name: "payin_intent_id")
  completedAt: Timestamp @col(name: "completed_at")
  failedAt: Timestamp @col(name: "failed_at")
  errorMessage: String @col(name: "error_message")
  metadata: Any! @default(sql: "'{}'::jsonb")
  createdAt: Timestamp! @col(name: "created_at") @default(sql: "now()")
  updatedAt: Timestamp! @col(name: "updated_at") @default(sql: "now()")
}

type RiskAssessment @table(name: "risk_assessments") {
  id: UUID! @default(sql: "gen_random_uuid()")
  institutionId: UUID @col(name: "institution_id")
  subjectType: String! @col(name: "subject_type")
  subjectId: UUID @col(name: "subject_id")
  address: String
  asset: String
  amount: Float @col(dataType: "numeric(36, 18)")
  provider: String! @default(value: "mock")
  riskLevel: RiskLevel! @col(name: "risk_level", dataType: "risk_level")
  riskScore: Int! @col(name: "risk_score")
  action: String! @default(value: "allow")
  reasons: [String!]!
  rawResponse: Any @col(name: "raw_response")
  metadata: Any! @default(sql: "'{}'::jsonb")
  createdAt: Timestamp! @col(name: "created_at") @default(sql: "now()")
}

type AuditEvent
  @table(name: "audit_events")
  @index(fields: ["subjectType", "subjectId"])
  @index(fields: ["createdAt"], order: [DESC]) {
  id: UUID! @default(sql: "gen_random_uuid()")
  institutionId: UUID @col(name: "institution_id")
  actorType: String! @col(name: "actor_type")
  actorId: String @col(name: "actor_id")
  subjectType: String! @col(name: "subject_type")
  subjectId: UUID @col(name: "subject_id")
  eventType: String! @col(name: "event_type")
  eventVersion: Int! @col(name: "event_version") @default(value: 1)
  payload: Any! @default(sql: "'{}'::jsonb")
  correlationId: String @col(name: "correlation_id")
  requestId: String @col(name: "request_id")
  ipAddress: String @col(name: "ip_address")
  createdAt: Timestamp! @col(name: "created_at") @default(sql: "now()")
}

type AvaSettleSummary @view(name: "v_avasettle_summary") {
  totalPayins: Int @col(name: "total_payins")
  confirmedPayins: Int @col(name: "confirmed_payins")
  totalPayouts: Int @col(name: "total_payouts")
  confirmedPayouts: Int @col(name: "confirmed_payouts")
  totalSettlements: Int @col(name: "total_settlements")
  completedSettlements: Int @col(name: "completed_settlements")
}
