mutation CreatePayinIntent(
  $externalId: String
  $invoiceId: String
  $mode: PayinMode!
  $network: String!
  $chainId: Int!
  $asset: String!
  $tokenAddress: String
  $decimals: Int!
  $amountExpected: Float!
  $amountExpectedAtomic: String!
  $depositAddress: String
  $derivationAccount: Int
  $derivationIndex: Int64
  $startBlock: Int64
  $expiresAt: Timestamp
  $metadata: Any!
)
@auth(level: PUBLIC, insecureReason: "Institutional connector scaffold; protect with Firebase/IAM before exposing externally.") {
  payinIntent_insert(
    data: {
      externalId: $externalId
      invoiceId: $invoiceId
      mode: $mode
      status: pending
      network: $network
      chainId: $chainId
      asset: $asset
      tokenAddress: $tokenAddress
      decimals: $decimals
      amountExpected: $amountExpected
      amountExpectedAtomic: $amountExpectedAtomic
      depositAddress: $depositAddress
      derivationAccount: $derivationAccount
      derivationIndex: $derivationIndex
      startBlock: $startBlock
      expiresAt: $expiresAt
      metadata: $metadata
    }
  )
}

mutation MarkPayinDetected(
  $id: UUID!
  $status: PayinStatus!
  $amountDetected: Float!
  $amountDetectedAtomic: String!
  $payerAddress: String
  $paidTxHash: String!
  $paidBlockNumber: Int64!
)
@auth(level: PUBLIC, insecureReason: "Institutional connector scaffold; protect with Firebase/IAM before exposing externally.") {
  payinIntent_update(
    id: $id
    data: {
      status: $status
      amountDetected: $amountDetected
      amountDetectedAtomic: $amountDetectedAtomic
      payerAddress: $payerAddress
      paidTxHash: $paidTxHash
      paidBlockNumber: $paidBlockNumber
    }
  )
}

