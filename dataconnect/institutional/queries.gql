query GetAvaSettleSummary
@auth(level: PUBLIC, insecureReason: "Institutional connector scaffold; protect with Firebase/IAM before exposing externally.") {
  avaSettleSummaries {
    totalPayins
    confirmedPayins
    totalPayouts
    confirmedPayouts
    totalSettlements
    completedSettlements
  }
}

query ListRecentPayins($limit: Int!)
@auth(level: PUBLIC, insecureReason: "Institutional connector scaffold; protect with Firebase/IAM before exposing externally.") {
  payinIntents(limit: $limit, orderBy: [{ createdAt: DESC }]) {
    id
    externalId
    invoiceId
    mode
    status
    network
    chainId
    asset
    amountExpected
    amountExpectedAtomic
    amountDetected
    depositAddress
    paidTxHash
    sweepTxHash
    createdAt
    updatedAt
  }
}

query GetPayinById($id: UUID!)
@auth(level: PUBLIC, insecureReason: "Institutional connector scaffold; protect with Firebase/IAM before exposing externally.") {
  payinIntent(id: $id) {
    id
    externalId
    invoiceId
    mode
    status
    asset
    amountExpected
    amountDetected
    depositAddress
    payerAddress
    paidTxHash
    paidBlockNumber
    sweepDestination
    sweepTxHash
    sweepBlockNumber
    metadata
    createdAt
    updatedAt
  }
}

query ListRecentPayouts($limit: Int!)
@auth(level: PUBLIC, insecureReason: "Institutional connector scaffold; protect with Firebase/IAM before exposing externally.") {
  payoutRequests(limit: $limit, orderBy: [{ createdAt: DESC }]) {
    id
    externalId
    chainFlowExternalTx
    chainFlowRetiroPago
    chainFlowTransferBlock
    status
    asset
    amount
    amountAtomic
    beneficiaryAddress
    treasuryAddress
    transactionHash
    blockNumber
    confirmations
    createdAt
    updatedAt
  }
}

query GetPayoutByExternalId($externalId: String!)
@auth(level: PUBLIC, insecureReason: "Institutional connector scaffold; protect with Firebase/IAM before exposing externally.") {
  payoutRequests(where: { externalId: { eq: $externalId } }, limit: 1) {
    id
    externalId
    status
    amount
    beneficiaryAddress
    transactionHash
    blockNumber
    confirmations
    errorMessage
    preparedAt
    authorizedAt
    broadcastedAt
    confirmedAt
    failedAt
  }
}

query ListRecentSettlements($limit: Int!)
@auth(level: PUBLIC, insecureReason: "Institutional connector scaffold; protect with Firebase/IAM before exposing externally.") {
  settlements(limit: $limit, orderBy: [{ createdAt: DESC }]) {
    id
    sourceType
    sourceId
    status
    asset
    grossAmount
    feeBps
    netAmount
    fiatCurrency
    fxRate
    fiatAmount
    completedAt
    createdAt
    updatedAt
  }
}

query ListAuditEventsForSubject($subjectId: UUID!, $limit: Int!)
@auth(level: PUBLIC, insecureReason: "Institutional connector scaffold; protect with Firebase/IAM before exposing externally.") {
  auditEvents(
    where: { subjectId: { eq: $subjectId } }
    limit: $limit
    orderBy: [{ createdAt: DESC }]
  ) {
    id
    actorType
    actorId
    subjectType
    subjectId
    eventType
    payload
    correlationId
    createdAt
  }
}
